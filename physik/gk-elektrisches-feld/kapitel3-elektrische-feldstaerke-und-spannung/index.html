<title>mint-interaktiv · Anmeldung</title>
<link rel="stylesheet" href="../../../assets/fonts.css">
<style>
:root{--bg:#F7F8FA;--surface:#fff;--ink:#1B2230;--muted:#5B6475;--line:#D9DDE5;--accent:#6B3FA0;--bad:#c2332b;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12151C;--surface:#1A1F29;--ink:#E6E9EF;--muted:#9BA3B4;--line:#2E3544;--accent:#B08BE0;--bad:#f07a70;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:17px/1.5 'Atkinson Hyperlegible',system-ui,sans-serif;padding:16px}
.box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px}
.k{font:600 12px 'JetBrains Mono',monospace;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
h1{font-family:Literata,Georgia,serif;font-size:28px;margin:.2em 0 .4em}
p{color:var(--muted);margin:0 0 18px;font-size:15px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
input[type=password]{width:100%;font:inherit;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:3px solid var(--accent);outline-offset:1px}
.row{display:flex;align-items:center;gap:8px;margin:14px 0 18px;font-size:15px}
.row input{width:20px;height:20px;accent-color:var(--accent)}
button{width:100%;font:700 16px 'Atkinson Hyperlegible',sans-serif;padding:12px;border-radius:10px;border:0;background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#12151C}}
.err{color:var(--bad);font-size:15px;min-height:1.5em;margin-top:12px}
</style>
</head>

<script>
(function(){
  const P=JSON.parse(document.getElementById('payload').textContent);
  const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
  const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
  async function open_(k){
    const d=u8(P.d);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d.slice(0,12)},k,d.slice(12));
    const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();
  }
  async function stored(){
    const r=sessionStorage.getItem('mi-key')||localStorage.getItem('mi-key');if(!r)return false;
    try{const k=await crypto.subtle.importKey('raw',u8(r),'AES-GCM',true,['decrypt']);await open_(k);return true;}
    catch(e){sessionStorage.removeItem('mi-key');localStorage.removeItem('mi-key');return false;}
  }
  document.getElementById('f').addEventListener('submit',async e=>{
    e.preventDefault();const err=document.getElementById('err'),go=document.getElementById('go');
    if(!window.crypto||!crypto.subtle){err.textContent='Dieser Browser unterstützt die Entschlüsselung nicht.';return;}
    go.disabled=true;go.textContent='Prüfe …';err.textContent='';
    try{
      const pw=document.getElementById('pw').value.trim();
      const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
      const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(P.s),iterations:P.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
      const raw=b64(await crypto.subtle.exportKey('raw',k));const keep=document.getElementById('keep').checked;
      await open_(k);
      sessionStorage.setItem('mi-key',raw);if(keep)localStorage.setItem('mi-key',raw);
    }catch(x){err.textContent='Das Passwort stimmt nicht.';go.disabled=false;go.textContent='Öffnen';}
  });
  if(document.readyState==='complete')stored();else window.addEventListener('load',stored);
})();
</script>
